[project]
name = "lifelog-data-vault"
version = "0.1.0"
description = "Personal lifelog Data Vault monorepo"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/lifelog_core", "packages/ingest"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.8",
    "pytest>=8.0",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["packages/lifelog_core/tests", "packages/ingest/lifelog_ingest/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
