# Local Metabase only. Not the legacy Vault Postgres in docker-compose.yml.
#
# Application database: a dedicated Postgres container on the named volume.
# Do not point MB_DB_* at Supabase.
# Warehouse login is configured in the UI (bi_reader). See docs/operations/metabase-setup.md.
# Image is the Metabase 64 LTS line (supported through 2027-12-01), pinned to a release.

name: lifelog-metabase

services:
  metabase-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabase}
      POSTGRES_DB: metabase
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.64.4
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase}
      JAVA_TIMEZONE: Asia/Tokyo
      # Metabase 0.64 migrations need about 2 GB. 1 GB OOMs and leaves the Liquibase lock held.
      JAVA_OPTS: "-Xmx2g"
      # Warehouse pool (local and hosted). bi_reader allows 10 connections.
      MB_JDBC_DATA_WAREHOUSE_MAX_CONNECTION_POOL_SIZE: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 503 while Liquibase is running is normal. Give the first migration several minutes.
      test: ["CMD", "curl", "--fail", "-I", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

volumes:
  metabase_db_data:
