# Local Metabase only. Not the legacy Vault Postgres in docker-compose.yml.
#
# Application database: H2 on the named volume. Do not point MB_DB_* at Supabase.
# Warehouse login is configured in the UI (bi_reader). See docs/operations/metabase-setup.md.
# Image is the Metabase 64 LTS line (supported through 2027-12-01), pinned to a release.

name: lifelog-metabase

services:
  metabase:
    image: metabase/metabase:v0.64.4
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/metabase-entrypoint.sh"]
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Asia/Tokyo
      # Metabase 0.64 migrations need about 2 GB. 1 GB OOMs and leaves the Liquibase lock held.
      JAVA_OPTS: "-Xmx2g"
      # Warehouse pool (local and hosted). bi_reader allows 10 connections.
      MB_JDBC_DATA_WAREHOUSE_MAX_CONNECTION_POOL_SIZE: "3"
    volumes:
      - metabase_data:/metabase-data
      - ./metabase-entrypoint.sh:/metabase-entrypoint.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 503 while Liquibase is running is normal. Give the first migration several minutes.
      test: ["CMD", "curl", "--fail", "-I", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

volumes:
  metabase_data:
