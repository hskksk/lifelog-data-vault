name: lifelog_vault
version: 1.0.0
config-version: 2
profile: lifelog_vault

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

# Schemas come from supabase/migrations. before_run schema creation is no-op via
# macros/supabase_skip_create_schema.sql (+create_schema does not disable that in dbt 1.12).
models:
  lifelog_vault:
    +create_schema: false
    staging:
      +schema: staging
    raw_vault:
      +schema: raw_vault
      # bi_reader SELECT. No-op if the role is absent. See docs/architecture/metabase.md.
      +post_hook:
        - "{{ grant_mart_to_bi_reader() }}"
    business_vault:
      +schema: business_vault
      # bi_reader SELECT. No-op if the role is absent. See docs/architecture/metabase.md.
      +post_hook:
        - "{{ grant_mart_to_bi_reader() }}"
    marts:
      +schema: mart
      # bi_reader SELECT. No-op if the role is absent. See docs/architecture/metabase.md.
      +post_hook:
        - "{{ grant_mart_to_bi_reader() }}"

vars:
  batch_id: null
