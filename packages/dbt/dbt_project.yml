name: lifelog_vault
version: 1.0.0
config-version: 2
profile: lifelog_vault

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

# Schemas are created in supabase/migrations (dbt_runner has no CREATE on database postgres).
models:
  lifelog_vault:
    +create_schema: false
    staging:
      +schema: staging
    raw_vault:
      +schema: raw_vault
    business_vault:
      +schema: business_vault
    marts:
      +schema: mart

vars:
  batch_id: null
