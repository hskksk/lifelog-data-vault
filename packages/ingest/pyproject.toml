[project]
name = "lifelog-ingest"
version = "0.1.0"
description = "Bronze ingest CLIs for lifelog sources"
requires-python = ">=3.12"
dependencies = [
  "lifelog-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
lifelog-ingest = "lifelog_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lifelog_ingest"]

[tool.uv.sources]
lifelog-core = { workspace = true }
