name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "packages/ingest-core/**"
      - "scripts/deploy.ts"
      - "scripts/lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".mise.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_PUSH_URL: ${{ secrets.SUPABASE_DB_PUSH_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hskksk/gh-actions/actions/setup-mise@v1

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @lifelog/ingest-core build

      - run: pnpm typecheck

      - uses: hskksk/gh-actions/actions/setup-supabase-cli@v1
        with:
          install: "false"

      - name: Create .env
        run: echo "INGEST_BEARER_TOKEN=${{ secrets.INGEST_BEARER_TOKEN }}" > .env

      - name: Deploy
        run: pnpm run deploy
