# Production copies that deploy does not update.
#
# config/person_map.yml
#   Replace Storage object bronze/config/person_map.yml,
#   or the PERSON_MAP_YAML secret if materialize uses that instead.
#   owntracks-materialize and macos-materialize both read this one file.
#
# Left out on purpose:
#   config/sources.yml is not read in production.
#   supabase/seed.sql is not applied by db push.
#   Vault passwords are secrets, not files in a pull request.

name: Notify manual config

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - config/person_map.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- manual-config-notice -->";
            const body = [
              marker,
              "",
              "`config/person_map.yml` を変更しています。deploy はこのファイルを Storage に送りません。",
              "",
              "マージ後、バケット `bronze` の `config/person_map.yml` をこの内容で置き換えてください。Edge の `PERSON_MAP_YAML` を使っている場合は、そちらも同じ内容にしてください。OwnTracks と Mac の materialize がこの 1 ファイルを読みます。",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (!existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              return;
            }
            if (existing.body !== body) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }
