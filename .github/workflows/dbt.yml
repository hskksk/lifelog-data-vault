name: dbt

on:
  # Materialize */15 is pg_cron in supabase/migrations — not a GHA workflow.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# Build the whole project: the marts merge OwnTracks and Mac sources, so a
# per-source selection cannot refresh them correctly.
jobs:
  dbt:
    uses: ./.github/workflows/dbt-build-remote.yml
    secrets: inherit
