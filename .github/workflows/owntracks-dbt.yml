name: owntracks-dbt

on:
  # Manual only (no cron). Materialize */15 is pg_cron in supabase/migrations — not a GHA workflow.
  workflow_dispatch:

concurrency:
  group: owntracks-dbt
  cancel-in-progress: false

jobs:
  dbt:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_PUSH_URL: ${{ secrets.SUPABASE_DB_PUSH_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hskksk/gh-actions/actions/setup-mise@v1

      - run: pnpm install --frozen-lockfile

      - uses: hskksk/gh-actions/actions/setup-supabase-cli@v1
        with:
          install: "false"

      - name: Link Supabase project
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}" --yes

      - name: Resolve dbt session pooler URL (Vault dbt_runner_password)
        id: dbt_db
        run: |
          url="$(pnpm exec tsx scripts/resolve-dbt-db-url.ts)"
          {
            echo "url<<EOF"
            echo "$url"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install dbt
        run: pip install -r packages/dbt/requirements-ci.txt

      - name: Use pip dbt on PATH (not mise / other dbt 1.13+)
        run: echo "${{ env.pythonLocation }}/bin" >> "$GITHUB_PATH"

      - name: Verify dbt version
        run: |
          which dbt
          dbt --version | head -3

      - name: Configure dbt profile (CI)
        working-directory: packages/dbt
        run: |
          cat > profiles.yml <<'EOF'
          lifelog_vault:
            target: ci
            outputs:
              ci:
                type: postgres
                url: "{{ env_var('SUPABASE_DB_URL') }}"
                schema: staging
                threads: 2
          EOF

      - name: dbt deps
        working-directory: packages/dbt
        run: dbt deps --profiles-dir .

      - name: dbt build tag:owntracks
        working-directory: packages/dbt
        env:
          SUPABASE_DB_URL: ${{ steps.dbt_db.outputs.url }}
        run: dbt build --select tag:owntracks --profiles-dir .
