name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:bi-connection
      - run: pnpm --filter @lifelog/ingest-core build
      - run: pnpm --filter @lifelog/ingest-core typecheck
      - run: pnpm --filter @lifelog/ingest-core test
      - run: pnpm --filter @lifelog/ingest typecheck
      - run: pnpm --filter @lifelog/ingest test
      - run: pnpm --filter @lifelog/ingest build
      - run: pnpm --filter @lifelog/macos-collector typecheck
      - run: pnpm --filter @lifelog/macos-collector test

  macos-collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
        working-directory: deploy/macos

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r packages/dbt/requirements-ci.txt
      - run: echo "${{ env.pythonLocation }}/bin" >> "$GITHUB_PATH"
      - run: cp packages/dbt/profiles.yml.example packages/dbt/profiles.yml
      - run: cd packages/dbt && dbt parse --profiles-dir . --target supabase_local
