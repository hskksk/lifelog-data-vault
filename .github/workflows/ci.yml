name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-packages
      - run: uv run ruff check packages/lifelog_core packages/ingest
      - run: uv run pytest packages/lifelog_core/tests -q

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install dbt-postgres~=1.9
      - run: cp packages/dbt/profiles.yml.example packages/dbt/profiles.yml
      - run: cd packages/dbt && dbt parse --profiles-dir .
