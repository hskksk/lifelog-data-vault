# Maps OwnTracks topic segments to hub_person business keys (non-secret).

default_person_id: me

# Optional: map the second segment of owntracks/<user>/<device> to person_id.
users:
  # me: me
  # partner: spouse
  hskksk: hskksk

# Optional association from a machine or OS account to person_id.
# These are not hub_device keys. Unlisted ids use default_person_id.
# See docs/architecture/macos-local-ingest.md.
# machines:
#   "<hardware-uuid>": me
# os_accounts:
#   "<hardware-uuid>:501": me
