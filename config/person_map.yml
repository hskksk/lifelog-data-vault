# Maps OwnTracks topic segments to hub_person business keys (non-secret).

default_person_id: me

# Optional: map the second segment of owntracks/<user>/<device> to person_id.
# users:
#   me: me
#   partner: spouse

# Optional: map a Mac / Health device business key to person_id.
# Unlisted devices use default_person_id. See docs/architecture/macos-local-ingest.md.
# devices:
#   "macos:<hardware-uuid>": me
#   "macos:<hardware-uuid>:uid:501": me
