# Non-secret source toggles and defaults (committed).

sources:
  manual:
    enabled: true
  activitywatch:
    enabled: false
  garmin:
    enabled: false
    lookback_days: 7
  apple_health:
    enabled: false
  owntracks:
    enabled: false
    # Legacy Hono path (OCI/Tunnel). Supabase prod: see docs/operations/owntracks-ingest-setup.md
    http_path: /ingest/owntracks
    h3_resolution: 9
    materialize_interval_minutes: 15
